services:
    db:
      image: postgres:16
      container_name: movies-db
      env_file:
        - .env
      ports:
        - "5432:5432"
      volumes:
        - movies-db-data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
volumes:
    movies-db-data: