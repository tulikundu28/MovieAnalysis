services:
  db:
    image: postgres:16
    container_name: movies-db
    env_file:
      - path: .env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - movies-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: tulikundu/movie-analysis:dev
    container_name: movies-app
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      APP_ENV: dev
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ.get('APP_PORT','8000')+'/healthz')\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  movies-db-data:
